[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "processor_tools"
dynamic = ["version"]
description = "Tools to support the developing of processing pipelines"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{name = "MetEOR Toolkit Team", email = "team@comet-toolkit.org"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "pyyaml",
    "pydantic",
    "python-dateutil",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-html",
    "pytest-cov",
    "ipython",
    "types-PyYAML",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx_book_theme",
    "sphinx_design",
    "sphinx_automodapi",
    "myst_parser",
]

[project.urls]
Homepage = "https://comet-toolkit.org/meteor"

[tool.setuptools.packages.find]
include = ["processor_tools*"]

[tool.setuptools_scm]
# version inferred from git tags (e.g. v0.1.0); no extra config needed

[tool.mypy]
allow_untyped_globals = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["processor_tools.tests.*", "processor_tools.*.tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = [
    "processor_tools/tests",
    "processor_tools/config/tests",
    "processor_tools/utils/tests",
]

[tool.ruff]
line-length = 120
exclude = ["docs"]

[tool.ruff.lint]
extend-ignore = ["W291"]

[tool.ruff.lint.per-file-ignores]
"processor_tools/__init__.py" = ["E402", "F401"]